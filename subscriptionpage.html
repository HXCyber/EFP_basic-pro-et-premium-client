<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice - Pricing Table</title>
    <link rel="stylesheet" href="subscriptions.css">
</head>
<body>

    <!-- Le grand conteneur violet -->
    <div class="pricing-container">

        <!-- --- CARTE BASIC --- -->
        <div class="card">
            <div class="card-header header-basic">BASIC</div>
            <div class="card-body">
                <div class="price"><sup>$</sup>29<sub>.99</sub></div>
                <div class="period">per month</div>
                <div class="feature">15 Email Accounts</div>
                <div class="feature">100GB Space</div>
                <div class="feature">1 Domain Name</div>
                <div class="feature">500GB Bandwidth</div>
                <div class="btn-box">
                    <span class="btn-cart">Add to cart</span>
                </div>
            </div>
        </div>

        <!-- --- CARTE PRO --- -->
        <div class="card">
            <div class="card-header header-pro">PRO</div>
            <div class="card-body">
                <div class="price"><sup>$</sup>49<sub>.99</sub></div>
                <div class="period">per month</div>
                <div class="feature">15 Email Accounts</div>
                <div class="feature">100GB Space</div>
                <div class="feature">1 Domain Name</div>
                <div class="feature">500GB Bandwidth</div>
                <div class="btn-box">
                    <span class="btn-cart">Add to cart</span>
                </div>
            </div>
        </div>

        <!-- --- CARTE PREMIUM --- -->
        <div class="card">
            <div class="card-header header-premium">PREMIUM</div>
            <div class="card-body">
                <div class="price"><sup>$</sup>79<sub>.99</sub></div>
                <div class="period">per month</div>
                <div class="feature">15 Email Accounts</div>
                <div class="feature">100GB Space</div>
                <div class="feature">1 Domain Name</div>
                <div class="feature">500GB Bandwidth</div>
                <div class="btn-box">
                    <span class="btn-cart">Add to cart</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
